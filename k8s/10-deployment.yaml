# Exercise requirement: "Access to MongoDB must be configured via an environment
# variable configured in Kubernetes." MONGODB_URI is sourced from a Secret
# (created out-of-band — see k8s/README.md), which is still an env var but keeps
# the credential out of git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodegoat
  labels:
    app: nodegoat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodegoat
  template:
    metadata:
      labels:
        app: nodegoat
    spec:
      serviceAccountName: nodegoat # 🔴 bound to cluster-admin (see 00-rbac.yaml)
      containers:
        - name: nodegoat
          image: europe-west1-docker.pkg.dev/clgcporg10-152/app/nodegoat:v1 # replaced at deploy time
          # A mutable tag is re-pushed during development, but the default pull
          # policy for a non-":latest" tag is IfNotPresent — so the node keeps
          # serving whatever bytes it cached under ":v1" and a re-push is a
          # silent no-op. Always re-pull here.
          # Production posture is different and stronger: pin by DIGEST and let
          # Binary Authorization verify an attestation against it (docs/decisions.md D13).
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: uri
            - name: PORT
              value: "4000"
          readinessProbe:
            httpGet:
              path: /login # NOT "/" — it 302s, and the GCE health check
              port: 4000 # rejects redirects (see 20-service-ingress.yaml)
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login # NOT "/" — it 302s, and the GCE health check
              port: 4000 # rejects redirects (see 20-service-ingress.yaml)
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
