# Demo prop — this pod SHOULD BE REJECTED by the Gatekeeper constraint in
# 90-preventative-gatekeeper.yaml. Apply it live to show the preventative
# control working:
#
#   kubectl apply -f 99-privileged-pod-DENYME.yaml
#   → Error from server ([deny-privileged-containers] privileged container is
#     not allowed: bad)
#
# The image is deliberately the ALLOWLISTED application image, not busybox, so
# that Binary Authorization admits it and Gatekeeper is unambiguously the
# control doing the rejecting. (An un-allowlisted image would be blocked first
# by Binary Authorization — see 99-unauthorized-image-DENYME.yaml — which would
# muddy which control fired.)
#
# Do NOT leave this running if it ever succeeds.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-test
spec:
  containers:
    - name: bad
      image: europe-west1-docker.pkg.dev/clgcporg10-152/app/nodegoat:v1
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
