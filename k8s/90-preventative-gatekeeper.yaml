# 🛡️ PREVENTATIVE CONTROL (Kubernetes layer)
#
# Deliberately blocks a *NEW* bad action rather than retro-fixing the existing
# intentional weaknesses — those must survive for the detective demo.
# Here: no new privileged containers. Demo it by watching the API server REJECT
# 99-privileged-pod-DENYME.yaml live.
#
# Requires Gatekeeper (or GKE Policy Controller):
#   kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/gatekeeper/release-3.16/deploy/gatekeeper.yaml
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdenyprivileged
spec:
  crd:
    spec:
      names:
        kind: K8sDenyPrivileged
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdenyprivileged

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          c.securityContext.privileged
          msg := sprintf("privileged container is not allowed: %v", [c.name])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDenyPrivileged
metadata:
  name: deny-privileged-containers
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
